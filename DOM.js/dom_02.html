<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f0f8ff;
    font-family: Arial, sans-serif;
    padding: 40px;
    text-align: center;
}

div {
    margin: 20px auto;
}

h3:first-child {
    background-color: #228b22;
    color: white;
    font-size: 30px;
    font-weight: bold;
    padding: 15px;
    width: 300px;
    border-radius: 10px;
}

ul {
    background-color: white;
    width: 300px;
    margin: auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

ol {
    list-style-position: inside;
    background-color: #e8f5e9;
    color: #333;
    font-size: 20px;
    padding: 12px;
    margin: 10px;
    border-radius: 8px;
}

ol:hover {
    background-color: #90ee90;
    cursor: pointer;
}

</style>
<body>
    <h1 style="visibility:hidden">Old Hidding </h1>
    <h3>Fruits</h3>
    <div>
        <ul>
            <ol>
                Mango
                </ol> 
                <ol>Litchi</ol>
                <ol>Orange</ol>
                <ol>Banana</ol>
             <ol> Guava</ol>
        </ul>
    </div>
</body>

</script>
</html>
