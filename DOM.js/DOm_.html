<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document Object Model </title>
</head>
<body>
    <h1>Document Object Model <span>(Dom)</span></h1>
    <p> this line is paragraph</p>
    <h2> H2 Is a heading Tag</h2>

<script> document.querySelector("h2").innerText=" Hello!"</script>
