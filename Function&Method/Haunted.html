
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Hadsa - Horror Story</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HOSTEL HADSA</h1>
        <p>Some Secrets Never Sleep...</p>
    </header>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    background: #180000;
    padding: 25px;
}

header h1 {
    color: red;
    font-size: 40px;
    letter-spacing: 5px;
}

.hero {
    height: 400px;
    background: linear-gradient(#0009, #000d),
    url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23");
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.hero h2 {
    font-size: 38px;
    color: red;
}

button {
    background: darkred;
    color: white;
    border: none;
    padding: 14px 25px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 5px;
}

button:hover {
    background: red;
}

.story {
    padding: 60px 20px;
}

.story h2 {
    color: red;
    margin-bottom: 20px;
}

.story p {
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 25px;
}

footer {
    background: #180000;
    padding: 20px;
}

    </style>

    <section class="hero">
        <h2>WELCOME TO ROOM 13</h2>
        <p>Once You Enter, You Can Never Escape.</p>
        <button onclick="startStory()">Start Story</button>
    </section>

    <section class="story">
        <h2>The Haunted Hostel</h2>
        <p id="storyText">
            It was midnight. Everyone was sleeping.
            Suddenly, a strange sound came from Room 13...
        </p>
        <button onclick="nextStory()">Next Chapter</button>
    </section>

    <footer>
        <p>© 2026 Hostel Hadsa | Horror Experience</p>
    </footer>

    <script src="Code.js"></script>
</body>
</html>
