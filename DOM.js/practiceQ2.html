<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f0f4f8;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px;
}

h1 {
    color: darkblue;
    margin-bottom: 30px;
}

.Box {
    height: 120px;
    width: 300px;
    background-color: lightblue;
    border: 2px solid blue;
    border-radius: 12px;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    font-weight: bold;
    color: darkblue;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.Box:hover {
    transform: scale(1.05);
    background-color: lightgreen;
}

</style>
<body>
<div class ="Box"></div>
    <div class  ="Box"></div>
        <div  class ="Box"></div>
</body>
